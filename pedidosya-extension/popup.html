<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MMM System - PedidosYa Linker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            margin: 0;
            padding: 16px;
            background-color: #f8fafc;
            color: #1e293b;
        }
        h2 {
            margin-top: 0;
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon {
            color: #ea580c;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            background: white;
            color: #1e293b;
        }
        input:focus {
            outline: none;
            border-color: #ea580c;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.15);
        }
        button {
            width: 100%;
            background-color: #ea580c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 4px;
        }
        button:hover {
            background-color: #c2410c;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            font-weight: 700;
            color: #16a34a;
            display: none;
        }
        .info-box {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #64748b;
            line-height: 1.4;
        }
        .footer {
            margin-top: 14px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <h2><span class="icon">🍕</span> MMM SYSTEM Linker</h2>

    <div class="info-box">
        Cada local tiene su propio código de vinculación. Puedes copiarlo desde el panel de administración en la sección <strong>Integraciones</strong>.
    </div>
        
    <div class="form-group">
        <label for="sucursalId">Código de Vinculación del Local</label>
        <input type="text" id="sucursalId" placeholder="Ej: 9d1bfdb8-cb79...">
    </div>

    <button id="saveBtn">Guardar y Vincular</button>
    <div id="status">✅ Vinculado correctamente</div>

    <div class="footer">
        Al recibir un pedido en PedidosYa, se enviará exclusivamente a este local.
    </div>

    <script src="popup.js"></script>
</body>
</html>
